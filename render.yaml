services:
  - type: web
    name: verifybgc-api
    runtime: node
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: API_BASE_URL
        value: http://127.0.0.1:3000
