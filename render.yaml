services:
  - type: web
    name: verifybgc-api
    runtime: node
    buildCommand: cd backend && npm ci && npm run build && echo "=== BUILD COMPLETE ===" && pwd && ls -la && echo "=== DIST FOLDER ===" && ls -la dist/
    startCommand: cd backend && echo "=== START PHASE ===" && pwd && echo "=== CHECKING DIST ===" && ls -la dist/ 2>&1 || echo "dist folder not found" && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: API_BASE_URL
        value: http://127.0.0.1:3000
